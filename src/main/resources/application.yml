# Customer-Specific Configuration
# This file contains application-specific configurations that customers can modify.
# Framework defaults are in internal-core/src/main/resources/application-internal.yml
# Any properties defined here will override the framework defaults.

# Activate the internal profile to load framework defaults
spring:
  profiles:
    active: internal
  application:
    name: qodo-app

# Version information for banner
application:
  version: "@project.version@"

core:
  version: "@core.version@"


# Jira webhook configuration
jira:
  webhook:
    secret: ${JIRA_WEBHOOK_SECRET:lower-test-token-replace}
    validate-signature: ${JIRA_WEBHOOK_VALIDATION_ENABLED:false}
    max-timestamp-age-seconds: -1
    # Agent blocking configuration to prevent webhook loops
    agent:
      account-id: ${JIRA_AGENT_ACCOUNT_ID:}
      block-enabled: ${JIRA_BLOCK_AGENT_WEBHOOKS:true}

# Messaging configuration
messaging:
  provider: ${MESSAGING_PROVIDER:activemq}
  queue:
    audit: ${MESSAGING_DEFAULT_TOPIC:audit}
    event: ${MESSAGING_EVENT_TOPIC:event}
    response: ${MESSAGING_RESPONSE_TOPIC:response}
  activemq:
    broker-url: ${MESSAGING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    username: ${MESSAGING_ACTIVEMQ_USERNAME:qodo}
    password: ${MESSAGING_ACTIVEMQ_PASSWORD:qodo}
  local:
    # Maximum capacity for each queue (number of messages)
    queue-capacity: ${LOCAL_QUEUE_CAPACITY:1000}
    # Number of consumer threads per queue (1 ensures message ordering)
    consumer-threads: ${LOCAL_CONSUMER_THREADS:1}
    # Maximum number of retry attempts for failed messages
    retry-attempts: ${LOCAL_RETRY_ATTEMPTS:3}
    # Initial delay in milliseconds before first retry
    retry-delay-ms: ${LOCAL_RETRY_DELAY_MS:1000}
    # Maximum delay in milliseconds between retries (with exponential backoff)
    max-retry-delay-ms: ${LOCAL_MAX_RETRY_DELAY_MS:30000}
    # Timeout in seconds for polling messages from the queue
    poll-timeout-seconds: ${LOCAL_POLL_TIMEOUT_SECONDS:5}
    # Whether to use exponential backoff for retries
    exponential-backoff: ${LOCAL_EXPONENTIAL_BACKOFF:true}
  kafka:
    # Connection settings
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    group-id: ${KAFKA_GROUP_ID:qodo-agent-group}
    # Consumer settings
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    enable-auto-commit: ${KAFKA_ENABLE_AUTO_COMMIT:false}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:500}
    max-poll-interval-ms: ${KAFKA_MAX_POLL_INTERVAL_MS:2100000}
    session-timeout-ms: ${KAFKA_SESSION_TIMEOUT_MS:30000}
    heartbeat-interval-ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:10000}
    request-timeout-ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
    # Producer settings
    retries: ${KAFKA_RETRIES:3}
    acks: ${KAFKA_ACKS:all}
    linger-ms: ${KAFKA_LINGER_MS:1}
    batch-size: ${KAFKA_BATCH_SIZE:16384}
    buffer-memory: ${KAFKA_BUFFER_MEMORY:33554432}
    # Security settings (SSL/SASL) - disabled by default
    security:
      enabled: ${KAFKA_SECURITY_ENABLED:false}
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      # SSL settings
      truststore-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      truststore-password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      keystore-location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      keystore-password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      key-password: ${KAFKA_SSL_KEY_PASSWORD:}
      # SASL settings
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}

# MCP (Model Context Protocol) Configuration
qodo:
  mcp:
    request-timeout-seconds: ${QODO_MCP_REQUEST_TIMEOUT_SECONDS:300}

logging:
  level:
    root: INFO
    ai.qodo.app.handlers.IncompleteAgentResponseHandler: TRACE
    com.davidparry.agent.core.config.client.McpClientManager: DEBUG
    com.davidparry.agent.core.config.MCPClientInitializer: DEBUG
    com.davidparry.agent.core: INFO
    com.davidparry.agent.core.service: INFO
    com.davidparry.agent.core.service.BaseHandler: TRACE
    org.apache.kafka.clients.admin.AdminClientConfig: ERROR
    org.apache.kafka.clients.consumer.ConsumerConfig: ERROR
    org.apache.kafka.clients.producer.ProducerConfig: ERROR
    org.apache.kafka.common.utils.AppInfoParser: ERROR
    org.apache.kafka.common.metrics.Metrics: ERROR
    com.provectus.kafka.ui.service.ClustersStatisticsScheduler: ERROR
